<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策划工具箱</title>
<style>
:root{
  --bg:#0f1115;
  --bg2:#151821;
  --panel:#171b24;
  --panel2:#1d2330;
  --card:#1b2230cc;
  --line:#2a3142;
  --text:#f2f5ff;
  --sub:#aeb8cc;
  --dim:#7f8aa3;
  --accent:#5ea2ff;
  --accent2:#7cb8ff;
  --success:#52d273;
  --danger:#ff637d;
  --radius:12px;
  --radius-sm:8px;
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
  --space-xl:20px;
  --space-2xl:24px;
  --space-3xl:32px;
  --btn-h:36px;
  --btn-h-lg:42px;
  --shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.03);
  --sidebar-width:260px;
}
*{
  box-sizing:border-box;
}
html{
  font-size:15px;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  margin:0;
  background:#0f1115;
  font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  font-weight:500;
  color:var(--text);
  text-rendering:optimizeLegibility;
  -webkit-user-select:none;
  user-select:none;
  -webkit-font-smoothing:auto;
  -moz-osx-font-smoothing:auto;
}
body{
  background:radial-gradient(circle at top,#1c2540 0%,#0f1115 45%);
}
button,input,textarea,select{
  font:inherit;
  color:inherit;
}
.app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
}
.sidebar{
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.005));
  backdrop-filter:blur(24px);
  border-right:1px solid rgba(255,255,255,.04);
  padding:16px 12px;
  padding-top:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}
.drag-bar{
  position:fixed;top:0;left:0;right:0;height:32px;
  z-index:9999;
}
.drag-bar:hover{cursor:default;}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 6px 6px;
}
.logo-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-icon svg{width:26px;height:26px;}
.logo h1{
  font-size:15px;
  margin:0;
}
.logo span{
  color:var(--dim);
  font-size:11px;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.nav-btn{
  height:36px;
  min-height:36px;
  font-size:12px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--sub);
  padding:0 12px;
  display:flex;
  align-items:center;
  cursor:pointer;
  transition:.18s;
  text-align:left;
}
.nav-btn:hover{
  background:rgba(255,255,255,.03);
  color:#fff;
}
.nav-btn.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(94,162,255,.22),rgba(94,162,255,.06));
  box-shadow:0 0 0 1px rgba(94,162,255,.18),0 8px 20px rgba(94,162,255,.1);
  font-weight:600;
}
.main{
  min-width:0;
  height:100%;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:68px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.topbar-left{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
}
.topbar-left h2{
  font-size:20px;
  font-weight:700;
  letter-spacing:.3px;
  margin:0;
  line-height:1.2;
}
.topbar-left .subtitle-text{
  color:var(--dim);
  font-size:11px;
  line-height:1.2;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--sub);
  font-size:11px;
}
.status-dot{
  width:8px;
  height:8px;
  border-radius:999px;
  background:var(--success);
  box-shadow:0 0 12px rgba(82,210,115,.7);
}
.status.running .status-dot{
  background:#ffc857;
  box-shadow:0 0 12px rgba(255,200,87,.7);
}
.close-btn{
  width:28px;height:28px;border:none;border-radius:6px;
  background:transparent;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:.15s;flex-shrink:0;
}
.close-btn:hover{
  background:var(--danger);color:#fff;
}
.content{
  flex:1;
  overflow:auto;
  padding:20px;
  width:100%;
  min-width:0;
}
.content-inner{
  width:100%;
  max-width:1800px;
  margin:0 auto;
}
.tab-panel{
  display:none;
}
.tab-panel.active{
  display:block;
}
.workbench{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:16px;
}
.card{
  background:linear-gradient(180deg,rgba(33,40,56,.9),rgba(20,24,34,.94));
  border:1px solid rgba(255,255,255,.05);
  border-radius:16px;
  padding:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.02);
  overflow:hidden;
  position:relative;
}
.card:hover{
  border-color:rgba(255,255,255,.07);
}
.card-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
}
.form-group{
  margin-bottom:12px;
}
.form-group label{
  display:block;
  margin-bottom:4px;
  color:var(--sub);
  font-size:11px;
}
input,select{
  width:100%;
  border:none;
  outline:none;
  background:#0e1219;
  border:1px solid #2a3040;
  border-radius:8px;
  height:36px;
  min-height:36px;
  padding:0 10px;
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
  font-size:13px;
  color:#fff;
}
textarea{
  width:100%;
  outline:none;
  background:#0e1219;
  border:1px solid #2a3040;
  border-radius:8px;
  min-height:80px;
  padding:8px 10px;
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
  font-size:13px;
  color:#fff;
  resize:vertical;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(94,162,255,.12),0 0 20px rgba(94,162,255,.08);
  background:#111720;
}
input::placeholder,textarea::placeholder{
  color:rgba(127,138,163,.45);
}
.btn{
  border:none;
  border-radius:8px;
  height:var(--btn-h);
  min-height:var(--btn-h);
  padding:0 14px;
  cursor:pointer;
  transition:transform .15s ease,opacity .18s ease,background .18s ease,box-shadow .18s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600;
  font-size:13px;
  letter-spacing:.2px;
  user-select:none;
  white-space:nowrap;
}
.btn:hover{
  transform:translateY(-1px);
}
.btn:active{
  transform:translateY(0);
}
.btn-primary{
  background:linear-gradient(180deg,#67adff,#4b8dff);
  color:#fff;
  box-shadow:0 12px 32px rgba(74,141,255,.32),inset 0 1px 0 rgba(255,255,255,.24);
}
.btn-primary:hover{
  box-shadow:0 16px 40px rgba(74,141,255,.44),inset 0 1px 0 rgba(255,255,255,.3);
}
.btn-normal{
  background:rgba(255,255,255,.04);
  color:var(--sub);
  border:1px solid rgba(255,255,255,.05);
}
.btn-normal:hover{
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.1);
  color:#fff;
}
.btn-danger{
  background:linear-gradient(180deg,#ff637d,#e04a62);
  color:#fff;
  box-shadow:0 12px 32px rgba(255,99,125,.32),inset 0 1px 0 rgba(255,255,255,.24);
}
.btn-danger:hover{
  box-shadow:0 16px 40px rgba(255,99,125,.44),inset 0 1px 0 rgba(255,255,255,.3);
}
.file-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.file-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:8px;
  background:rgba(255,255,255,.015);
  border:1px solid transparent;
  transition:.18s;
  cursor:pointer;
}
.file-item:hover{
  background:rgba(255,255,255,.03);
  border-color:rgba(94,162,255,.15);
}
.file-item.selected{
  background:rgba(94,162,255,.1);
  border-color:rgba(94,162,255,.28);
}
.file-item input[type="checkbox"]{
  width:14px;
  height:14px;
  accent-color:var(--accent);
}
.wf-layout{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.wf-tree{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.wf-parent{
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;
  overflow:hidden;
  transition:.2s;
  position:relative;
}
.wf-parent.expanded{
  background:rgba(94,162,255,.04);
  border-color:rgba(94,162,255,.2);
}
.wf-parent-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  cursor:pointer;
  user-select:none;
  transition:.18s;
}
.wf-parent-header:hover{
  background:rgba(255,255,255,.03);
}
.wf-parent.expanded .wf-parent-header{
  border-bottom:1px solid rgba(255,255,255,.06);
}
.wf-arrow{
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dim);
  transition:transform .22s ease;
  font-size:11px;
  flex-shrink:0;
}
.wf-parent.expanded .wf-arrow{
  transform:rotate(90deg);
}
.wf-parent-check{
  width:16px;
  height:16px;
  accent-color:var(--accent);
  cursor:pointer;
  flex-shrink:0;
}
.wf-parent-name{
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
}
.wf-parent-name .wf-edit-icon{
  display:inline-block;
  vertical-align:middle;
  margin-left:4px;
  opacity:.25;
  transition:opacity .15s;
  line-height:1;
}
.wf-parent-name:hover .wf-edit-icon{
  opacity:.6;
}
.wf-name-input{
  flex:1;
  font-weight:600;
  font-size:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--accent);
  border-radius:5px;
  color:var(--text);
  padding:2px 8px;
  outline:none;
  height:28px;
  min-width:60px;
}
.wf-play-btn{
  margin-left:auto;
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  background:rgba(94,162,255,.1);
  border-radius:6px;
  color:var(--accent);
  cursor:pointer;
  font-size:12px;
  transition:.15s;
  flex-shrink:0;
  padding:0;
  line-height:1;
}
.wf-play-btn:hover{
  background:rgba(94,162,255,.25);
  color:#fff;
  transform:scale(1.12);
}
.wf-copy-btn{
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:rgba(94,162,255,.1);
  border-radius:6px;color:var(--accent);
  cursor:pointer;font-size:12px;
  transition:.15s;flex-shrink:0;
  padding:0;line-height:1;
}
.wf-copy-btn:hover{
  background:rgba(94,162,255,.25);
  color:#fff;
  transform:scale(1.12);
}
.wf-del-btn{
  position:absolute;top:0;right:0;
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;
  color:var(--dim);
  cursor:pointer;font-size:11px;
  transition:.15s;padding:0;line-height:1;
  z-index:2;
}
.wf-del-btn:hover{background:rgba(244,71,71,.15);color:var(--danger);}
.wf-children{
  display:none;
  padding:8px 14px 12px;
  gap:6px;
}
.wf-parent.expanded .wf-children{
  display:flex;
  flex-direction:column;
}
.wf-child{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:8px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.04);
  transition:.18s;
  position:relative;
}
.wf-child:hover{
  background:rgba(255,255,255,.04);
  border-color:rgba(94,162,255,.15);
}
.wf-child-check{
  width:14px;
  height:14px;
  accent-color:var(--accent);
  cursor:pointer;
  flex-shrink:0;
}
.wf-child-type{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  padding:2px 8px;
  border-radius:4px;
  font-weight:600;
  flex-shrink:0;
}
.wf-child-type.export_text{background:rgba(94,162,255,.15);color:#7cb8ff;}
.wf-child-type.upload_svn{background:rgba(82,210,115,.15);color:#52d273;}
.wf-child-type.merge_table{background:rgba(255,184,102,.15);color:#ffb866;}
.wf-child-type.merge_translation{background:rgba(200,150,255,.15);color:#c896ff;}
.wf-child-type.export_error_code{background:rgba(255,99,125,.15);color:#ff637d;}
.wf-child-type.lock_svn{background:rgba(255,140,0,.15);color:#ff8c00;}
.wf-child-type.open_tables{background:rgba(100,200,255,.15);color:#64c8ff;}
.wf-child-name{
  flex:1;
  font-size:13px;
  color:var(--text);
}
.wf-child-name small{
  color:var(--dim);
  font-size:11px;
  margin-left:6px;
}
.wf-settings-btn{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  background:rgba(255,255,255,.04);
  border-radius:6px;
  color:var(--dim);
  cursor:pointer;
  transition:.15s;
  flex-shrink:0;
  font-size:14px;
  margin-right:5px;
}
.wf-settings-btn:hover{
  background:rgba(94,162,255,.15);
  color:var(--accent);
}
.wf-child-del-btn{
  position:absolute;top:0;right:0;
  width:22px;height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  background:transparent;
  color:var(--dim);
  cursor:pointer;
  font-size:11px;
  transition:.15s;
  padding:0;
  line-height:1;
  z-index:2;
}
.wf-child-del-btn:hover{
  background:rgba(244,71,71,.12);
  color:var(--danger);
}
.wf-toolbar{
  display:flex;
  gap:8px;
  margin-top:4px;
}
.wf-toolbar .btn{
  height:var(--btn-h);
  font-size:12px;
  flex:1;
}
.wf-dragging{
  border:2px dashed var(--accent) !important;
  background:rgba(94,162,255,.06) !important;
  border-radius:10px;
  opacity:.5;
}
.wf-drag-ghost{
  opacity:.7;
  box-shadow:0 0 0 1px rgba(94,162,255,.3);
}
.wf-drop-line{
  height:3px;
  background:var(--accent);
  border-radius:2px;
  margin:-1px 0;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
}
.wf-drop-line.show{
  opacity:1;
}
.wf-modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:1000;
  justify-content:center;
  align-items:center;
}
.wf-modal-overlay.show{
  display:flex;
}
.wf-modal{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:14px;
  width:480px;
  max-width:90vw;
  max-height:80vh;
  overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  padding:20px;
}
.wf-modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.wf-modal-header h3{
  margin:0;
  font-size:16px;
}
.wf-modal-close{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:none;
  background:rgba(255,255,255,.05);
  border-radius:7px;
  color:var(--dim);
  cursor:pointer;
  font-size:16px;
  transition:.15s;
}
.wf-modal-close:hover{
  background:rgba(255,255,255,.1);
  color:#fff;
}
.wf-modal-body{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.wf-modal-body .form-group label{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  color:var(--sub);
  font-weight:500;
}
.wf-modal-body .form-group input,
.wf-modal-body .form-group select{
  width:100%;
  height:var(--btn-h);
  border-radius:7px;
  font-size:12px;
}
.wf-modal-body .form-hint{
  font-size:11px;
  color:var(--dim);
  margin-top:2px;
}
.confirm-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:2000;
  justify-content:center;
  align-items:center;
}
.confirm-overlay.show{
  display:flex;
}
.confirm-dialog{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:14px;
  width:400px;
  max-width:85vw;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  padding:24px;
}
.confirm-dialog-title{
  font-size:16px;
  font-weight:600;
  color:var(--text);
  margin:0 0 12px 0;
}
.confirm-dialog-msg{
  font-size:14px;
  color:var(--sub);
  line-height:1.5;
  margin:0 0 20px 0;
  word-break:break-word;
}
.confirm-dialog-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}
.confirm-dialog .btn{
  min-width:80px;
}
.translate-layout{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:16px;
}
.log{
  background:#090b10;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.05);
  padding:10px;
  height:320px;
  min-height:320px;
  max-height:320px;
  overflow:auto;
  font-family:"Cascadia Code",Consolas,"Courier New",monospace;
  font-size:12px;
  line-height:1.65;
  color:var(--sub);
  -webkit-user-select:text;
  user-select:text;
}
.log .error{color:var(--danger);}
.log .success{color:var(--success);}
.log .info{color:var(--accent);}
.log .warn{color:#ffb866;}
.log .ts{color:var(--dim);margin-right:4px;}
.toggle-group{
  display:flex;
  gap:4px;
}
.toggle-btn{
  padding:6px 14px;
  border:none;
  border-radius:7px;
  background:rgba(255,255,255,.03);
  color:var(--sub);
  cursor:pointer;
  transition:.18s;
  font-size:12px;
  font-weight:500;
}
.toggle-btn:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
}
.toggle-btn.active{
  background:linear-gradient(135deg,rgba(94,162,255,.28),rgba(94,162,255,.1));
  color:#fff;
  font-weight:600;
  box-shadow:0 0 0 1px rgba(94,162,255,.25),0 4px 14px rgba(94,162,255,.12);
}
.action-center{
  display:flex;
  justify-content:center;
  margin:20px 0 8px;
  grid-column:1 / -1;
}
.action-center .btn{
  min-width:260px;
  height:var(--btn-h-lg);
  border-radius:12px;
  font-size:14px;
  font-weight:700;
}
.svn-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 580px;
  gap:16px;
}
.svn-log-wrap{
  grid-column:1 / -1;
}
.upload-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 580px;
  gap:16px;
}
.upload-log-wrap{
  grid-column:1 / -1;
}
.tr-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 580px;
  gap:16px;
}
.tr-log-wrap{
  grid-column:1 / -1;
}
.wf-log-wrap{
  grid-column:1 / -1;
}
.wf-log-section{

<body>

<script>
const S = {};
const nav = [
  {key:"svn",label:"SVN 记录"},
  {key:"upload",label:"复制上传"},
  {key:"workflow",label:"工作流"},
  {key:"translate",label:"翻译"},
];
nav.forEach(n => { S[n.key] = {el:null,built:false,logEl:null}; });
const sidebarNav = document.getElementById("sidebar_nav");
const content = document.getElementById("content");
nav.forEach(n=>{
  const btn = document.createElement("button");
  btn.className = "nav-btn";
  btn.textContent = n.label;
  btn.dataset.key = n.key;
  sidebarNav.appendChild(btn);
  S[n.key].navBtn = btn;
});
nav.forEach(n => {
  const panel = document.createElement("div");
  panel.className = "tab-panel";
  panel.id = "tab-" + n.key;
  content.appendChild(panel);
  S[n.key].panel = panel;
});
let config = {};
async function loadConfig() {
  const r = await fetch("/api/config");
  config = await r.json();
}
async function saveConfig(updates) {
  Object.assign(config, updates);
  await fetch("/api/config", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(updates)});
}
const tabMeta = {
  svn:{title:"SVN 记录",sub:"修改摘要、版本对比与导出工具"},
  upload:{title:"复制上传",sub:"批量文件复制上传到 SVN 工作目录"},
  workflow:{title:"工作流",sub:"自动化 SVN 操作编排"},
  translate:{title:"翻译",sub:"Excel 多语言批量翻译工作台"},
};
function switchTab(key) {
  nav.forEach(n => {
    S[n.key].panel.classList.remove("active");
    S[n.key].navBtn.classList.remove("active");
  });
  S[key].panel.classList.add("active");
  S[key].navBtn.classList.add("active");
  const meta = tabMeta[key];
  if (meta) {
    document.getElementById("page_title").textContent = meta.title;
    document.getElementById("page_subtitle").textContent = meta.sub;
  }
  if (!S[key].built) {
    buildTab(key);
  } else if (key === "upload") {
    const src = document.getElementById("upload_src");
    if (src && src.value.trim()) refreshFiles();
  }
}
function buildTab(key) {
  const panel = S[key].panel;
  panel.innerHTML = '<div class="empty-state">加载中…</div>';
  setTimeout(() => {
    switch(key) {
      case "svn": buildSvnTab(panel); break;
      case "upload": buildUploadTab(panel); break;
      case "workflow": buildWorkflowTab(panel); break;
      case "translate": buildTranslateTab(panel); break;
    }
    S[key].built = true;
  }, 20);
}
const now = new Date();
const cy = now.getFullYear();
const cm = now.getMonth()+1;
const cd = now.getDate();
function buildSvnTab(panel) {
  const today = `${cy}-${String(cm).padStart(2,"0")}-${String(cd).padStart(2,"0")}`;
  const yearStart = `${cy}-01-01`;
  panel.innerHTML = `
    <div class="workbench svn-layout">
      <div class="svn-main">
        <div class="card">
          <div class="card-title">SVN 地址</div>
          <div class="flex-row">
            <input type="text" id="svn_url" placeholder="输入 SVN 仓库 URL" style="flex:1" autocomplete="off" class="svn-url-drop-target">
            <button class="btn btn-normal" style="flex-shrink:0" data-action="browse-svn-url" title="浏览本地SVN工作副本">浏览</button>
            <button class="btn btn-normal" style="flex-shrink:0" data-action="open-svn-url" title="打开文件夹">打开</button>
          </div>
          <div class="svn-url-drop-hint">可将文件/文件夹拖拽到输入框自动识别 SVN 地址</div>
        </div>
        <div class="card">
          <div class="card-title">操作设置</div>
          <div class="form-group">
            <label>模式</label>
            <div class="toggle-group" id="svn_mode_group">
              <button class="toggle-btn active" data-v="summary">修改摘要</button>
              <button class="toggle-btn" data-v="compare">对比 Excel</button>
              <button class="toggle-btn" data-v="export">导出文件</button>
            </div>
          </div>
          <div class="form-group">
            <label>日期范围</label>
            <div class="flex-row" style="align-items:center">
              <input type="date" id="svn_start" value="${yearStart}" style="flex:1;min-width:0">
              <span style="color:var(--dim)">—</span>
              <input type="date" id="svn_end" value="${today}" style="flex:1;min-width:0">
              <button class="btn btn-normal" data-action="svn-today">今日</button>
            </div>
          </div>
        </div>
      </div>
      <div class="svn-side">
        <div class="card">
          <div class="section-label">过滤与输出</div>
          <div class="form-group">
            <label>关键词过滤</label>
            <input type="text" id="svn_keyword" placeholder="按SVN提交备注过滤" autocomplete="off">
          </div>
          <div class="form-group">
            <label>提交者过滤</label>
            <input type="text" id="svn_author" placeholder="按作者过滤" autocomplete="off">
          </div>
          <div class="form-group">
            <label>输出目录</label>
            <div class="flex-row">
              <input type="text" id="svn_output" placeholder="选择输出目录" style="flex:1" autocomplete="off">
              <button class="btn btn-normal" style="flex-shrink:0" data-action="browse-svn-output" id="svn_browse_btn">浏览</button>
              <button class="btn btn-normal" style="flex-shrink:0" data-action="open-svn-output" title="打开输出文件夹" id="svn_open_btn">打开</button>
            </div>
            <div style="display:flex;margin-top:8px">
              <div style="margin-left:auto;width:56px;text-align:center">
                <button data-action="svn-advanced" title="高级设置" style="border:none;background:transparent;color:var(--dim);font-size:32px;padding:0;cursor:pointer;line-height:1">⚙</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="action-center">
        <button class="btn btn-primary" data-action="run-svn" data-output="#svn_output">开始执行</button>
      </div>
      <div class="svn-log-wrap">
        <div class="card">
          <div class="card-header compact">
            <span style="font-weight:600">执行日志</span>
            <div style="margin-left:auto;display:flex;gap:8px">
              <button class="btn btn-normal btn-sm" data-action="svn-clear-cache">清除缓存</button>
            </div>
          </div>
          <div class="log" id="svn_log"></div>
        </div>
      </div>
    </div>
  `;
  initSuggest("svn_url", config.svn_urls||[]);
  enablePathDrop("svn_url", { mode: "svn" });
  enablePathDrop("svn_output", { mode: "path" });
  if (config.svn_urls?.length) document.getElementById("svn_url").value = config.svn_urls[0];
  document.getElementById("svn_url").addEventListener("keydown",e=>{
    if (e.key === "Enter") {
      const val = e.target.value.trim();
      if (val && val.startsWith("http")) {
        saveConfig({svn_urls: [val, ...(config.svn_urls||[]).filter(u=>u!==val)].slice(0,20)});
        config.svn_urls = [val, ...(config.svn_urls||[]).filter(u=>u!==val)].slice(0,20);
        initSuggest("svn_url", config.svn_urls);
      }
    }
  });
  document.getElementById("svn_output").value = config.output_dir || "";
  initSuggest("svn_output", config.output_dir_history||[]);
  document.getElementById("svn_url").addEventListener("blur", ()=>{
    const val = document.getElementById("svn_url").value.trim();
    if (val && val.startsWith("http") && !config.svn_urls.includes(val)) {
      saveConfig({svn_urls: [val, ...(config.svn_urls||[])].slice(0,20)});
      config.svn_urls = [val, ...(config.svn_urls||[])].slice(0,20);
      initSuggest("svn_url", config.svn_urls);
    }
  });
  document.getElementById("svn_output").addEventListener("blur", ()=>{
    const val = document.getElementById("svn_output").value.trim();
    if (val && !config.output_dir_history.includes(val)) {
      saveConfig({output_dir_history: [val, ...(config.output_dir_history||[])].slice(0,10)});
      config.output_dir_history = [val, ...(config.output_dir_history||[])].slice(0,10);
      initSuggest("svn_output", config.output_dir_history);
    }
  });
  initSuggest("svn_keyword", config.svn_keyword_history||[]);
  initSuggest("svn_author", config.svn_author_history||[]);
  ["svn_keyword","svn_author"].forEach(id => {
    document.getElementById(id).addEventListener("blur", ()=>{
      const val = document.getElementById(id).value.trim();
      const key = id==="svn_keyword" ? "svn_keyword_history" : "svn_author_history";
      if (val && !(config[key]||[]).includes(val)) {
        saveConfig({[key]: [val, ...(config[key]||[])].slice(0,20)});
        initSuggest(id, config[key]);
      }
    });
  });
  S.svn.logEl = document.getElementById("svn_log");
}
function runSvn() {
  const mode = document.querySelector("#svn_mode_group .toggle-btn.active")?.dataset.v || "compare";
  const body = {
    svn_url:document.getElementById("svn_url").value.trim(),
    mode,
    start_date:document.getElementById("svn_start").value,
    end_date:document.getElementById("svn_end").value,
    keyword:document.getElementById("svn_keyword")?.value||"",
    author:document.getElementById("svn_author")?.value||"",
    output:document.getElementById("svn_output")?.value||""
  };
  const out = body.output;
  const kw = body.keyword;
  const au = body.author;
  saveConfig({
    output_dir: out,
    output_dir_history: [out, ...(config.output_dir_history||[]).filter(u=>u!==out)].slice(0,10),
    svn_urls: [body.svn_url, ...(config.svn_urls||[]).filter(u=>u!==body.svn_url)].slice(0,20),
    svn_keyword_history: kw && !(config.svn_keyword_history||[]).includes(kw) ? [kw, ...(config.svn_keyword_history||[])].slice(0,20) : config.svn_keyword_history,
    svn_author_history: au && !(config.svn_author_history||[]).includes(au) ? [au, ...(config.svn_author_history||[])].slice(0,20) : config.svn_author_history,
  });
  config.svn_urls = [body.svn_url, ...(config.svn_urls||[]).filter(u=>u!==body.svn_url)].slice(0,20);
  if (kw && !(config.svn_keyword_history||[]).includes(kw)) config.svn_keyword_history = [kw, ...(config.svn_keyword_history||[])].slice(0,20);
  if (au && !(config.svn_author_history||[]).includes(au)) config.svn_author_history = [au, ...(config.svn_author_history||[])].slice(0,20);
  initSuggest("svn_url", config.svn_urls);
  initSuggest("svn_keyword", config.svn_keyword_history||[]);
  initSuggest("svn_author", config.svn_author_history||[]);
  runTask("/api/svn/run", body, document.querySelector("[data-action='run-svn']"), "svn_log");
}
function buildUploadTab(panel) {
  panel.innerHTML = `
    <div class="workbench upload-layout">
      <div class="upload-main">
        <div class="card">
          <div class="card-title">源目录</div>
          <div class="flex-row">
            <input type="text" id="upload_src" placeholder="选择源目录" style="flex:1" autocomplete="off">
            <button class="btn btn-normal" data-action="browse-upload-src">浏览</button>
            <button class="btn btn-normal" data-action="refresh-files">刷新</button>
          </div>
        </div>
        <div class="card">
          <div class="card-header compact">
            <div class="card-title">文件列表</div>
            <div class="flex-row">
              <button class="btn btn-normal btn-sm" data-action="select-all">全选</button>
              <button class="btn btn-normal btn-sm" data-action="select-none">取消全选</button>
            </div>
          </div>
          <div class="file-list" id="upload_files"></div>
        </div>
      </div>
      <div class="upload-side">
        <div class="card">
          <div class="section-label">目标设置</div>
          <div class="form-group">
            <label>SVN 目标目录</label>
            <div class="flex-row">
              <input type="text" id="upload_tgt" placeholder="选择目标 SVN 工作目录" style="flex:1" autocomplete="off">
              <button class="btn btn-normal" data-action="browse-upload-tgt">浏览</button>
            </div>
          </div>
        </div>
      </div>
      <div class="action-center">
        <button class="btn btn-primary" data-action="run-upload">上传到 SVN</button>
      </div>
      <div class="upload-log-wrap">
        <div class="card">
          <div class="card-header compact">
            <span style="font-weight:600">执行日志</span>
            <button class="btn btn-normal btn-sm" data-action="clear-changelist">清理changelist</button>

function runWorkflow() {
  const pairs = [];
  document.querySelectorAll(".wf-parent").forEach((parent) => {
    const wfIdx = Number(parent.dataset.idx);
    const checks = parent.querySelectorAll(".wf-child-check:checked");
    checks.forEach(cb => {
      const child = cb.closest(".wf-child");
      const stepIdx = [...parent.querySelector(".wf-children").children].indexOf(child);
      if (stepIdx >= 0) pairs.push({wf_idx: wfIdx, step_idx: stepIdx});
    });
  });
  if (!pairs.length) { _showToast("请勾选要执行的步骤"); return; }
  const byWf = {};
  pairs.forEach(p => {
    if (!byWf[p.wf_idx]) byWf[p.wf_idx] = [];
    byWf[p.wf_idx].push(p.step_idx);
  });
  const keys = Object.keys(byWf).map(Number).sort();
    const wfNames = {};
    document.querySelectorAll(".wf-parent").forEach(el => {
      wfNames[Number(el.dataset.idx)] = config.workflows[Number(el.dataset.idx)]?.name || "工作流";
    });
    const logContainer = document.getElementById("wf_log");
    logContainer.innerHTML = "";
    keys.forEach(wfIdx => {
      const name = wfNames[wfIdx] || `工作流${wfIdx}`;
      const section = document.createElement("div");
      section.className = "wf-log-section";
      section.innerHTML = `<div class="wf-log-section-header">${escapeHtml(name)}</div><div class="wf-log-body" data-wf="${wfIdx}"></div>`;
      logContainer.appendChild(section);
    });
    keys.forEach(wfIdx => {
      const body = logContainer.querySelector(`.wf-log-body[data-wf="${wfIdx}"]`);
      const name = wfNames[wfIdx] || `工作流${wfIdx}`;
      runTask("/api/workflow/run", {wf_idx: wfIdx, step_indices: byWf[wfIdx]}, null, body.id || (body.id = "wf_log_"+wfIdx+"_"+Date.now()), name);
    });
}

  if (!step || !step.type) return "";
  const t = step.type;
  if (t === "open_tables") {
    const paths = step.file_paths || [];
    return paths.map(p => { const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/")); return i >= 0 ? p.substring(i+1) : p; }).filter(Boolean).join(",");
  }
  if (t === "lock_svn") {
    const p = step.target_path || "";
    const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/"));
    return i >= 0 ? p.substring(i+1) : p;
  }
  if (t === "export_text") {
    const p = step.input_file || "";
    const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/"));
    return i >= 0 ? p.substring(i+1) : p;
  }
  if (t === "upload_svn") {
    const dirs = step.dirs || [];
    return dirs.map(d => { const s = d.replace(/[\/\\]$/,""); const i = Math.max(s.lastIndexOf("\\"), s.lastIndexOf("/")); return i >= 0 ? s.substring(i+1) : s; }).filter(Boolean).join(",");
  }
  if (t === "merge_translation") {
    const p = step.original_file || "";
    const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/"));
    return i >= 0 ? p.substring(i+1) : p;
  }
  if (t === "export_error_code") {
    return step.lang_codes || "";
  }
  if (t === "merge_table") {
    const paths = step.input_paths || [];
    return paths.map(p => { const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/")); return i >= 0 ? p.substring(i+1) : p; }).filter(Boolean).join(",");
  }
  return "";
}

let _wfRunningTasks = 0;
async function runTask(url, body, btn, logId, label) {
  const logEl = document.getElementById(logId);
  if (label) {
    if (_wfRunningTasks === 0) {
      const statusBar = document.getElementById("status_bar");
      statusBar.classList.add("running");
      statusBar.querySelector("span").textContent = "运行中";
    }
    _wfRunningTasks++;
  } else {
    if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>执行中...';
    logEl.innerHTML = "";
    const statusBar = document.getElementById("status_bar");
    statusBar.classList.add("running");
    statusBar.querySelector("span").textContent = "运行中";
  }
  const r = await fetch(url, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d = await r.json();

  function _done() {
    if (label) {
      _wfRunningTasks--;
      if (_wfRunningTasks <= 0) {
        const sb = document.getElementById("status_bar");
        sb.classList.remove("running");
        sb.querySelector("span").textContent = "系统空闲";
      }
    } else {
      btn.disabled = false;
      btn.textContent = btn.dataset.orig;
      const sb = document.getElementById("status_bar");
      sb.classList.remove("running");
      sb.querySelector("span").textContent = "系统空闲";
    }
  }

  if (d.error) {
    logEl.innerHTML = '<span class="error">❌ '+escapeHtml(d.error)+'</span>';
    _done();
    return;
  }
  const evtSrc = new EventSource("/api/log/stream/" + d.task_id);
  let _outputPath = "";
  evtSrc.onmessage = (e) => {
    if (e.data === "[DONE]") {
      evtSrc.close();
      _done();
      if (_outputPath) {
        fetch("/api/open/folder", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:_outputPath})}).then(r=>r.json()).then(d=>{
          if (!d.ok) console.warn("打开文件夹失败:", d);
        }).catch(e=>console.warn("打开文件夹请求失败:", e));
        const _hint = document.createElement("div");
        _hint.textContent = "📂 已打开输出文件夹";
        _hint.style.color = "var(--accent)";
        logEl.appendChild(_hint);
      }
      return;
    }
    const lines = e.data.split("\n");
    for (const raw of lines) {
      if (!raw.trim()) continue;
      const m = raw.match(/^\[(\d{2}:\d{2}:\d{2})\](?:\[(\w+)\])?\s*(.*)/);
      let tag = "", msg = raw;
      if (m) {
        msg = m[3] || "";
        tag = (m[2] || "").toLowerCase();
        msg = `<span class="ts">${m[1]}</span> ${msg}`;
      }
      if (label) {
        msg = `<span style="color:var(--accent);font-weight:600">[${escapeHtml(label)}]</span> ${msg}`;
      }
      const cls = {"error":"error","warn":"warn","ok":"success","success":"success","info":"info"}[tag] || "";
      const div = document.createElement("div");
      div.className = cls;
      div.innerHTML = msg;
      const _m = msg.match(/(?:已生成修改总结|修改总结)[:\s]+(.+?)\\修改总结\.txt/);
      if (_m) _outputPath = _m[1].trim();
      const _pm = msg.match(/\[输出路径\]\s+(.+)/);
      if (_pm && !_outputPath) _outputPath = _pm[1].trim();
      logEl.appendChild(div);
    }
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 32;
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  };
  evtSrc.onerror = () => {
    evtSrc.close();
    _done();
    logEl.innerHTML += "\n⚠ 日志连接中断\n";
  };
}

function saveAdvFilePreset() {
  const name = document.getElementById("adv_cmp_file").value.trim();
  const cmp_title_rows = document.getElementById("adv_cmp_title_rows").value.trim() || "1";
  const cmp_id_col = document.getElementById("adv_cmp_id_col").value || "1";
  const cmp_output_cols = document.getElementById("adv_cmp_output_cols").value.trim();
  if (name) {
    const payload = {
      cmp_file_presets: [...new Set([name, ...(config.cmp_file_presets || [])])],
      cmp_file_settings: Object.assign({}, config.cmp_file_settings || {}, {
        [name]: { cmp_title_rows, cmp_id_col, cmp_output_cols }
      })
    };
    fetch("/api/config", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(r=>r.json()).then(d=>{
        if (d.ok) {
          config.cmp_file_presets = payload.cmp_file_presets;
          config.cmp_file_settings = payload.cmp_file_settings;
          advRefreshPresetList();
        }
      });
  } else {
    const payload = { cmp_title_rows, cmp_id_col, cmp_output_cols };
    fetch("/api/config", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(r=>r.json()).then(d=>{

          config.cmp_title_rows = cmp_title_rows;
          config.cmp_id_col = cmp_id_col;
          config.cmp_output_cols = cmp_output_cols;

      });

function delAdvFilePreset() {

  const presets = (config.cmp_file_presets || []).filter(n => n !== name);
  const settings = Object.assign({}, config.cmp_file_settings || {});
  delete settings[name];
  const payload = { cmp_file_presets: presets, cmp_file_settings: settings };
  fetch("/api/config", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(d=>{
      if (d.ok) {
        config.cmp_file_presets = presets;
        config.cmp_file_settings = settings;
        document.getElementById("adv_cmp_file").value = "";

let _suggests = {};
let _activeInputId = null;
let _portal = null;
function _getPortal() {
  if (!_portal) {
    _portal = document.createElement("div");
    _portal.className = "suggest-drop";
    document.body.appendChild(_portal);
  }
  return _portal;
}
function initSuggest(inputId, items) {
  if (!items.length) return;
  _suggests[inputId] = { items };
}
function _showSuggest(inputId, showAll) {
  const s = _suggests[inputId];
  if (!s) return;
  const inp = document.getElementById(inputId);
  if (!inp) return;
  const val = inp.value.toLowerCase();
  const visible = s.items.map((u,i) => ({val:u, idx:i})).filter(x => showAll || !val || x.val.toLowerCase().includes(val));
  const portal = _getPortal();
  portal.innerHTML = visible.length
    ? visible.map(x => {
        const label = x.val || "⊙ 全局默认";
        const dim = !x.val ? ' style="color:var(--dim)"' : '';
        return `<div class="s-item" data-idx="${x.idx}" data-val="${escapeHtml(x.val)}"${dim}><span class="s-label">${escapeHtml(label)}</span><button class="s-del" data-del-idx="${x.idx}" title="删除">×</button></div>`;
      }).join("")
    : '<div class="s-item" style="color:var(--dim);cursor:default">无匹配记录</div>';
  const rect = inp.getBoundingClientRect();
  portal.style.top = (rect.bottom + 4) + "px";
  portal.style.left = rect.left + "px";
  portal.style.minWidth = rect.width + "px";
  portal.classList.add("show");
  _activeInputId = inputId;
  s.selIdx = -1;
}
function _hideSuggest() {
  if (_portal) _portal.classList.remove("show");
  _activeInputId = null;
}
function _selectSuggest(val) {
  if (_activeInputId) {
    const inp = document.getElementById(_activeInputId);
    inp.value = val;
    inp.dispatchEvent(new Event("input", {bubbles:true}));
    const _configMap = {svn_url:"svn_urls",svn_keyword:"svn_keyword_history",svn_author:"svn_author_history",svn_output:"output_dir_history",upload_src:"src_dir_history",upload_tgt:"tgt_dir_history",tr_src:"tr_src_history",tr_ref:"tr_ref_history",tr_out:"tr_out_dir"};
    const ck = _configMap[_activeInputId];
    if (ck && config[ck]) {
      const updated = [val, ...config[ck].filter(v=>v!==val)].slice(0,20);
      saveConfig({[ck]: updated});
      config[ck] = updated;
      initSuggest(_activeInputId, updated);
    }
  }
  _hideSuggest();
}
document.addEventListener("focusin", e => {
  const inp = e.target.closest("input[autocomplete='off']");
  if (inp && inp.id && _suggests[inp.id]) _showSuggest(inp.id, true);
});
document.addEventListener("input", e => {
  const inp = e.target.closest("input[autocomplete='off']");
  if (inp && inp.id && _suggests[inp.id]) _showSuggest(inp.id);

document.addEventListener("click", e => {
  const del = e.target.closest("[data-del-idx]");
  if (del && _activeInputId) {
    e.stopPropagation();
    const idx = Number(del.dataset.delIdx);
    const s = _suggests[_activeInputId];
    if (s && idx >= 0 && idx < s.items.length) {
      const removed = s.items[idx];
      s.items.splice(idx, 1);
      const map = {svn_url:["svn_urls",20], svn_output:["output_dir_history",10], upload_src:["src_dir_history",20], upload_tgt:["tgt_dir_history",20], tr_src:["tr_src_history",20], tr_ref:["tr_ref_history",20], tr_out:["tr_out_dir",20], adv_cmp_file:["cmp_file_presets",20]};
      const mk = map[_activeInputId];
      if (mk) {
        const hist = (config[mk[0]]||[]).filter(v=>v!==removed);
        saveConfig({[mk[0]]: hist});
        config[mk[0]] = hist;
      }
      _showSuggest(_activeInputId, true);
    }
    return;
  }
  const item = e.target.closest(".suggest-drop .s-item");
  if (item && item.dataset.val !== undefined) {
    _selectSuggest(item.dataset.val);
    return;
  }
  if (!e.target.closest(".suggest-drop") && !e.target.closest("input[autocomplete='off']")) {
    _hideSuggest();
  }
});
document.addEventListener("keydown", e => {
  if (!_activeInputId || !_portal || !_portal.classList.contains("show")) return;
  const s = _suggests[_activeInputId];
  if (!s) return;
  const items = _portal.querySelectorAll(".s-item:not([style*='cursor:default'])");
  if (e.key === "ArrowDown") {
    e.preventDefault();
    s.selIdx = Math.min((s.selIdx||-1) + 1, items.length - 1);
    items.forEach((el,i) => el.classList.toggle("sel", i === s.selIdx));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    s.selIdx = Math.max((s.selIdx||0) - 1, 0);
    items.forEach((el,i) => el.classList.toggle("sel", i === s.selIdx));
  } else if (e.key === "Enter") {
    if (s.selIdx >= 0 && items[s.selIdx]) {
      e.preventDefault();
      _selectSuggest(items[s.selIdx].dataset.val);
    }
  } else if (e.key === "Escape") {
    _hideSuggest();
  }
});

function showConfirm({title="确认", message="", confirmText="确定", cancelText="取消", danger=false}={}){
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm_overlay");
    const titleEl = document.getElementById("confirm_title");
    const msgEl = document.getElementById("confirm_msg");
    const okBtn = document.getElementById("confirm_ok_btn");
    const cancelBtn = document.getElementById("confirm_cancel_btn");
    titleEl.textContent = title;
    msgEl.textContent = message;
    okBtn.textContent = confirmText;
    cancelBtn.textContent = cancelText;
    if (cancelText) {
      cancelBtn.style.display = "";
    } else {
      cancelBtn.style.display = "none";
    }
    if (danger) {
      okBtn.className = "btn btn-danger";
    } else {
      okBtn.className = "btn btn-primary";
    }
    const cleanup = () => {
      overlay.classList.remove("show");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      overlay.removeEventListener("click", onOverlay);
    };
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    const onOverlay = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    overlay.addEventListener("click", onOverlay);
    overlay.classList.add("show");
    okBtn.focus();
  });
}
function showAlert(message, title="提示"){
  return showConfirm({title, message, confirmText:"确定", cancelText:""});
}
async function browseFile(inputId, initialDir) {
  if (window.pywebview && pywebview.api && pywebview.api.browseFile) {
    try {
      const path = await pywebview.api.browseFile(initialDir || "");
      if (path) {
        document.getElementById(inputId).value = path;
        if (typeof window._wfModalAutoSave === "function") window._wfModalAutoSave();
      }
    } catch (e) {
      _showToast("pywebview error: " + e.message);
    }
  } else {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".xlsx,.xls,.xlsm";
    input.onchange = () => {
      if (input.files[0]) {
        document.getElementById(inputId).value = input.files[0].path || input.files[0].name;
      }
    };
    input.click();
  }
}
function getBrowserZoom() {
  if (window.visualViewport && window.visualViewport.scale) {
    return window.visualViewport.scale;
  }
  if (window.outerWidth && window.innerWidth) {
    return Math.round(window.outerWidth / window.innerWidth * 100) / 100;
  }
  return 1;
}
function checkZoom() {
  const scale = getBrowserZoom();
  const warn = document.getElementById("zoom_warning");
  if (!warn || warn.dataset.dismissed === "1") return;
  if (Math.abs(scale - 1) > 0.02) {
    warn.classList.add("visible");
  } else {
    warn.classList.remove("visible");
  }
}
let _zoomPollTimer = null;
window.addEventListener("DOMContentLoaded", async () => {
  await loadConfig();
  switchTab("svn");
  setTimeout(checkZoom, 300);
  _zoomPollTimer = setInterval(checkZoom, 1500);
});
document.getElementById("close_btn")?.addEventListener("click", ()=>{
  fetch("/api/close", {method:"POST"});
});

const RESIZE_EDGE = 8;
let _resizeState = null;

function _setEdgeCursor(cursor) {
  document.body.style.cursor = cursor;
  document.querySelectorAll('.drag-bar').forEach(el => el.style.cursor = cursor);
}

function _hasVScrollbar(el) {
  return el && el.scrollHeight > el.clientHeight;
}

function getEdge(mx, my) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const l = mx < RESIZE_EDGE;
  const r = mx > vw - RESIZE_EDGE;
  const t = my < RESIZE_EDGE;
  const b = my > vh - RESIZE_EDGE;
  const CORNER = 4;
  if (t && l && mx < CORNER && my < CORNER) return 'top-left';
  if (t && r && mx > vw - CORNER && my < CORNER) return 'top-right';
  if (b && l && mx < CORNER && my > vh - CORNER) return 'bottom-left';
  if (b && r && mx > vw - CORNER && my > vh - CORNER) return 'bottom-right';
  if (r) {
    const content = document.querySelector('.content');
    if (_hasVScrollbar(content)) {
      const sbw = content.offsetWidth - content.clientWidth;
      const cr = content.getBoundingClientRect();
      if (mx > cr.right - sbw) {
        return null;
      }
    }
  }
  if (l) return 'left';
  if (r) return 'right';
  if (t) return 'top';
  if (b) return 'bottom';
  return null;
}

const _cursorMap = {
  'left':'ew-resize','right':'ew-resize',
  'top':'ns-resize','bottom':'ns-resize',
  'top-left':'nwse-resize','bottom-right':'nwse-resize',
  'top-right':'nesw-resize','bottom-left':'nesw-resize',
};

let _dragState = null;
let _resizeTick = 0;

document.addEventListener('mousemove', function(e) {
  if (_resizeState || _dragState) {
    e.preventDefault();
    const now = Date.now();
    if (now - _resizeTick < 25) return;
    _resizeTick = now;
    if (window.pywebview && window.pywebview.api) {
      const p = _resizeState ? window.pywebview.api.resize() : window.pywebview.api.move();
      p.then(function(active) {
        if (!active) {
          _resizeState = null;
          _dragState = null;
          _setEdgeCursor('');
        }
      });
    }
    return;
  }
  const edge = getEdge(e.clientX, e.clientY);
  _setEdgeCursor(edge ? _cursorMap[edge] : '');
});

document.addEventListener('mousedown', function(e) {
  if (e.target.closest('.drag-bar')) {
    const edge = getEdge(e.clientX, e.clientY);
    if (!edge) {
      e.preventDefault();
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.start_resize('move');
        _dragState = true;
      }
      return;
    }
  }
  const edge = getEdge(e.clientX, e.clientY);
  if (!edge) return;
  e.preventDefault();
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.start_resize(edge);
    _resizeState = true;
  }
});

document.addEventListener('mouseup', function(e) {
  if (_resizeState) {
    _resizeState = null;
    _setEdgeCursor('');
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.stop_resize();
    }
  }
  if (_dragState) {
    _dragState = null;
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.stop_resize();
    }
  }
});

document.addEventListener('mouseleave', function() {
  if (_resizeState || _dragState) {
    _resizeState = null;
    _dragState = null;
    _setEdgeCursor('');
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.stop_resize();
    }
  }
});
</script>
